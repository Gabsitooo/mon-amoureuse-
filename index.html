<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>❤️ Quiz de l'Amour — Gabriel & Amandine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Raleway:wght@300;400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    /* ─── VARIABLES ─────────────────────────────────────────── */
    :root {
      --black:      #080808;
      --dark:       #111111;
      --red:        #c4193b;
      --red-lite:   #e8304c;
      --red-glow:   rgba(196,25,59,.45);
      --gold:       #d4af37;
      --gold-lite:  #f5d76e;
      --gold-glow:  rgba(212,175,55,.35);
      --white:      #ffffff;
      --white-soft: #f2ede6;
      --text-dim:   rgba(255,255,255,.55);
      --ok:         #2ecc71;
      --ok-glow:    rgba(46,204,113,.4);
      --glass-bg:   rgba(255,255,255,.04);
      --glass-b:    rgba(255,255,255,.08);
    }

    /* ─── RESET ──────────────────────────────────────────────── */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; height:100%;
      overflow:hidden;
      font-family:'Raleway', sans-serif;
      background:var(--black);
      color:var(--white);
    }

    /* ─── BACKGROUND CANVAS ──────────────────────────────────── */
    #bg {
      position:fixed; inset:0; z-index:0;
      pointer-events:none;
    }

    /* ─── AMBIENT GLOW ───────────────────────────────────────── */
    .ambient {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:
        radial-gradient(ellipse 55% 40% at 15% 55%, rgba(196,25,59,.07) 0%, transparent 70%),
        radial-gradient(ellipse 55% 40% at 85% 45%, rgba(212,175,55,.055) 0%, transparent 70%),
        radial-gradient(ellipse 80% 60% at 50% 100%, rgba(196,25,59,.04) 0%, transparent 60%);
    }

    /* ─── SCREEN SYSTEM ──────────────────────────────────────── */
    .screen {
      position:fixed; inset:0; z-index:10;
      display:flex; align-items:center; justify-content:center;
      padding:20px;
      opacity:0;
      pointer-events:none;
      transition:opacity .75s cubic-bezier(.4,0,.2,1);
    }
    .screen.active { opacity:1; pointer-events:all; }
    #question-screen, #result-screen { overflow-y:auto; align-items:flex-start; }

    /* ─── MUSIC BUTTON ───────────────────────────────────────── */
    #music-btn {
      position:fixed; top:18px; right:18px; z-index:200;
      width:44px; height:44px; border-radius:50%;
      border:1px solid rgba(212,175,55,.3);
      background:rgba(255,255,255,.05);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      font-size:19px; color:var(--gold);
      transition:all .3s ease;
    }
    #music-btn:hover {
      background:rgba(212,175,55,.1);
      border-color:var(--gold);
      box-shadow:0 0 16px var(--gold-glow);
      transform:scale(1.06);
    }

    /* ═══════════════════════════════════════════════════════════
       LANDING
    ══════════════════════════════════════════════════════════════ */
    #landing { flex-direction:column; text-align:center; }

    .landing-inner {
      display:flex; flex-direction:column; align-items:center;
      gap:26px; max-width:600px; width:100%;
    }

    /* Photo */
    .photo-wrap {
      position:relative;
      width:150px; height:150px;
      animation:float 4.5s ease-in-out infinite;
    }
    .photo-ring {
      position:absolute; inset:-6px; border-radius:50%;
      border:2px solid var(--gold);
      box-shadow:0 0 28px var(--gold-glow), 0 0 56px rgba(212,175,55,.1);
      animation:spinRing 12s linear infinite;
    }
    .photo-ring::before {
      content:'';
      position:absolute; top:-4px; left:50%; transform:translateX(-50%);
      width:10px; height:10px; border-radius:50%;
      background:var(--gold);
      box-shadow:0 0 8px var(--gold);
    }
    .photo-inner {
      width:150px; height:150px; border-radius:50%; overflow:hidden;
      position:relative; z-index:1;
      background:linear-gradient(135deg,#1c1014,#2a1520);
      display:flex; align-items:center; justify-content:center;
      font-size:56px;
    }
    /* To use a real photo, replace the div.photo-inner content with:
       <img src="photo.jpg" alt="" style="width:100%;height:100%;object-fit:cover"> */

    @keyframes float {
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-14px); }
    }
    @keyframes spinRing {
      to{ transform:rotate(360deg); }
    }

    /* Landing texts */
    .l-occasion {
      font-family:'Dancing Script', cursive;
      font-size:clamp(1.3rem,4vw,1.9rem);
      color:var(--gold); letter-spacing:.5px;
      opacity:0; animation:fadeUp .9s ease .4s forwards;
    }
    .l-title {
      font-family:'Playfair Display', serif;
      font-size:clamp(2rem,6vw,3.4rem);
      line-height:1.25; font-style:italic;
      opacity:0; animation:fadeUp .9s ease .9s forwards;
    }
    .l-title .r { color:var(--red); font-style:normal; }
    .l-sig {
      font-family:'Dancing Script', cursive;
      font-size:clamp(1.2rem,3.5vw,1.8rem);
      color:var(--gold); font-style:normal;
      display:block; margin-top:8px;
    }
    .l-sub {
      font-size:clamp(.8rem,2vw,.95rem);
      color:var(--text-dim); font-weight:300; letter-spacing:1.5px;
      opacity:0; animation:fadeUp .9s ease 1.4s forwards;
    }
    .l-btn-wrap {
      opacity:0; animation:fadeUp .9s ease 1.9s forwards;
    }

    /* ═══════════════════════════════════════════════════════════
       BUTTONS
    ══════════════════════════════════════════════════════════════ */
    .btn {
      display:inline-flex; align-items:center; gap:10px;
      padding:15px 46px; border-radius:60px;
      border:1px solid var(--gold);
      background:linear-gradient(135deg, var(--red) 0%, #7a0f20 100%);
      color:#fff;
      font-family:'Raleway', sans-serif;
      font-weight:700; font-size:.85rem;
      letter-spacing:3px; text-transform:uppercase;
      cursor:pointer; position:relative; overflow:hidden;
      transition:all .4s cubic-bezier(.4,0,.2,1);
      box-shadow:0 4px 20px rgba(196,25,59,.28);
    }
    .btn::before {
      content:'';
      position:absolute; inset:0;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);
      transform:translateX(-110%);
      transition:transform .55s ease;
    }
    .btn:hover::before { transform:translateX(110%); }
    .btn:hover {
      transform:translateY(-3px);
      box-shadow:0 14px 40px rgba(196,25,59,.5), 0 0 22px var(--gold-glow);
      border-color:var(--gold-lite);
    }
    .btn:active { transform:translateY(-1px); }

    /* ═══════════════════════════════════════════════════════════
       QUOTE SCREEN
    ══════════════════════════════════════════════════════════════ */
    #quote-screen { flex-direction:column; text-align:center; }

    .quote-wrap {
      max-width:680px; padding:20px;
      opacity:0; transform:translateY(24px);
      transition:opacity .8s ease, transform .8s ease;
    }
    .quote-wrap.in { opacity:1; transform:translateY(0); }
    .quote-wrap.out { opacity:0; transform:translateY(-24px); }

    .q-mark {
      font-size:90px; line-height:1;
      font-family:Georgia,serif;
      background:linear-gradient(135deg, var(--red), var(--gold));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
      opacity:.5;
    }
    .q-text {
      font-family:'Playfair Display', serif;
      font-size:clamp(1.25rem,3.5vw,1.9rem);
      font-style:italic; line-height:1.65;
      margin:8px 0 20px;
    }
    .q-line {
      width:50px; height:2px;
      background:linear-gradient(90deg,var(--red),var(--gold));
      margin:0 auto 14px; border-radius:1px;
    }
    .q-author {
      font-size:.75rem; letter-spacing:3px; text-transform:uppercase;
      color:var(--gold); font-weight:600;
    }

    /* ═══════════════════════════════════════════════════════════
       QUESTION SCREEN
    ══════════════════════════════════════════════════════════════ */
    #question-screen { padding-top:clamp(20px,4vw,40px); padding-bottom:clamp(20px,4vw,40px); }

    .q-inner {
      width:100%; max-width:820px;
      display:flex; flex-direction:column; gap:20px;
      margin:auto;
    }

    /* Progress row */
    .prog-row {
      display:flex; align-items:center; gap:14px;
    }
    .prog-label {
      font-size:.7rem; letter-spacing:2.5px; text-transform:uppercase;
      color:var(--gold); font-weight:700; white-space:nowrap;
    }
    .prog-track {
      flex:1; height:4px; border-radius:2px;
      background:rgba(255,255,255,.08); overflow:hidden;
    }
    .prog-fill {
      height:100%; border-radius:2px;
      background:linear-gradient(90deg, var(--red), var(--gold));
      transition:width .65s cubic-bezier(.4,0,.2,1);
      box-shadow:0 0 10px var(--red-glow);
    }
    .score-chip {
      font-size:.7rem; letter-spacing:2px; color:var(--gold); font-weight:700; white-space:nowrap;
    }

    /* Question card */
    .q-card {
      background:var(--glass-bg);
      backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
      border:1px solid var(--glass-b); border-radius:24px;
      padding:clamp(22px,4vw,38px);
      box-shadow:0 8px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
      animation:cardIn .55s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes cardIn {
      from{ opacity:0; transform:translateY(20px) scale(.98); }
      to{ opacity:1; transform:translateY(0) scale(1); }
    }
    .q-label {
      font-size:.65rem; letter-spacing:3px; text-transform:uppercase;
      color:var(--red); font-weight:700; margin-bottom:10px;
    }
    .q-question {
      font-family:'Playfair Display', serif;
      font-size:clamp(1.1rem,3vw,1.55rem); line-height:1.5;
    }

    /* Answers grid */
    .ans-grid {
      display:grid; grid-template-columns:1fr 1fr; gap:14px;
      animation:cardIn .55s cubic-bezier(.34,1.56,.64,1) .08s both;
    }
    @media(max-width:500px){ .ans-grid{ grid-template-columns:1fr; } }
    @media(max-height:620px){
      .q-inner{ gap:12px; }
      .q-card{ padding:14px; }
      .ans-grid{ gap:8px; }
    }

    .ans-btn {
      display:flex; align-items:center; gap:14px;
      padding:clamp(13px,2.5vw,18px) clamp(14px,2.5vw,22px);
      border-radius:16px;
      border:1px solid rgba(255,255,255,.07);
      background:rgba(255,255,255,.03);
      backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
      color:var(--white);
      font-family:'Raleway', sans-serif;
      font-size:clamp(.82rem,2vw,.98rem); font-weight:500;
      cursor:pointer; text-align:left;
      transition:all .28s cubic-bezier(.4,0,.2,1);
      position:relative; overflow:hidden;
    }
    .ans-letter {
      width:30px; height:30px; border-radius:50%; flex-shrink:0;
      border:1px solid rgba(212,175,55,.3);
      display:flex; align-items:center; justify-content:center;
      font-size:.72rem; font-weight:700; color:var(--gold);
      transition:all .28s ease;
    }
    .ans-btn:hover {
      border-color:rgba(212,175,55,.4);
      background:rgba(212,175,55,.07);
      transform:translateY(-2px);
      box-shadow:0 6px 24px rgba(0,0,0,.35);
    }
    .ans-btn:hover .ans-letter {
      border-color:var(--gold); background:rgba(212,175,55,.12);
    }
    .ans-btn.correct {
      border-color:var(--ok) !important;
      background:rgba(46,204,113,.1) !important;
      box-shadow:0 0 22px var(--ok-glow), 0 4px 20px rgba(0,0,0,.3) !important;
    }
    .ans-btn.correct .ans-letter {
      background:var(--ok) !important; border-color:var(--ok) !important; color:#fff !important;
    }
    .ans-btn.wrong {
      border-color:var(--red) !important;
      background:rgba(196,25,59,.1) !important;
      animation:shake .48s ease;
    }
    .ans-btn.wrong .ans-letter {
      background:var(--red) !important; border-color:var(--red) !important; color:#fff !important;
    }
    .ans-btn:disabled { cursor:default; }

    @keyframes shake {
      0%,100%{ transform:translateX(0); }
      18%{ transform:translateX(-7px); }
      36%{ transform:translateX(7px); }
      54%{ transform:translateX(-5px); }
      72%{ transform:translateX(5px); }
    }

    /* Feedback */
    .feedback {
      text-align:center; min-height:40px;
      font-weight:600; font-size:.9rem; letter-spacing:.5px;
      opacity:0; transition:opacity .35s ease;
      padding:8px;
    }
    .feedback.show { opacity:1; }
    .feedback.ok { color:var(--ok); }
    .feedback.bad { color:#ff7070; }

    /* ═══════════════════════════════════════════════════════════
       RESULT SCREEN
    ══════════════════════════════════════════════════════════════ */
    #result-screen { text-align:center; padding-top:30px; padding-bottom:30px; }

    .res-inner {
      max-width:660px; width:100%; margin:auto;
      display:flex; flex-direction:column; align-items:center; gap:24px;
    }

    .res-icon {
      font-size:clamp(64px,15vw,90px);
      animation:pop .6s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    @keyframes pop {
      from{ transform:scale(0); opacity:0; }
      to{ transform:scale(1); opacity:1; }
    }

    .res-stars { display:flex; gap:8px; }
    .res-star {
      font-size:clamp(1.4rem,4vw,2rem);
      opacity:0;
      animation:starPop .38s cubic-bezier(.34,1.56,.64,1) forwards;
    }
    @keyframes starPop {
      from{ transform:scale(0) rotate(-25deg); opacity:0; }
      to{ transform:scale(1) rotate(0); opacity:1; }
    }

    .res-title {
      font-family:'Playfair Display', serif;
      font-size:clamp(1.9rem,6vw,3rem);
      font-style:italic; line-height:1.2;
    }

    .res-score-num {
      font-family:'Playfair Display', serif;
      font-size:clamp(3.5rem,12vw,5.5rem);
      font-weight:700; color:var(--gold); line-height:1;
      text-shadow:0 0 50px var(--gold-glow);
    }
    .res-score-lbl {
      font-size:.72rem; letter-spacing:3px; text-transform:uppercase;
      color:var(--text-dim); margin-top:4px;
    }

    .res-msg {
      font-family:'Playfair Display', serif;
      font-size:clamp(.95rem,3vw,1.25rem);
      font-style:italic; line-height:1.75;
      color:var(--white-soft); max-width:520px;
    }
    .res-msg .r { color:var(--red); }
    .res-msg .g { color:var(--gold); }

    /* Shimmer for perfect score */
    .shimmer {
      background:linear-gradient(90deg,#fff 0%,var(--gold-lite) 28%,#fff 56%,var(--gold) 78%,#fff 100%);
      background-size:220% auto;
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
      animation:shimmer 3s linear infinite;
    }
    @keyframes shimmer { to{ background-position:220% center; } }

    /* Confetti piece */
    .conf {
      position:fixed; pointer-events:none; z-index:999; border-radius:2px;
      animation:confFall linear forwards;
    }
    @keyframes confFall {
      0%{ transform:translateY(-10px) rotate(0deg); opacity:1; }
      100%{ transform:translateY(108vh) rotate(720deg); opacity:0; }
    }

    /* Floating heart (result) */
    .hf {
      position:fixed; pointer-events:none; z-index:6;
      animation:hfloat linear forwards;
    }
    @keyframes hfloat {
      0%{ transform:translateY(0) rotate(0deg) scale(1); opacity:.9; }
      100%{ transform:translateY(-105vh) rotate(380deg) scale(.5); opacity:0; }
    }

    /* Heart burst */
    .hb {
      position:fixed; pointer-events:none; z-index:50;
      transition:transform .7s ease, opacity .7s ease;
    }

    /* ─── KEYFRAMES shared ───── */
    @keyframes fadeUp {
      from{ opacity:0; transform:translateY(28px); }
      to{ opacity:1; transform:translateY(0); }
    }

    /* ─── Mobile tweaks ──────── */
    @media(max-width:420px){
      .photo-wrap{ width:110px; height:110px; }
      .photo-inner{ width:110px; height:110px; }
      .landing-inner{ gap:18px; }
    }

    /* ═══════════════════════════════════════════════════════════
       LETTER SCREEN — Cinematic love letter
    ══════════════════════════════════════════════════════════════ */
    #letter-screen {
      background:#020202;
      flex-direction:column;
      overflow-y:auto; align-items:flex-start;
      transition:opacity 2s cubic-bezier(.4,0,.2,1);
      padding:0;
    }

    /* Cinematic vignette */
    #letter-vignette {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:radial-gradient(ellipse 72% 70% at 50% 50%, transparent 25%, rgba(0,0,0,.72) 100%);
    }

    /* Warm centre pulse */
    #letter-glow {
      position:fixed; inset:0; z-index:1; pointer-events:none;
      background:radial-gradient(ellipse 48% 55% at 50% 50%, rgba(196,25,59,.045) 0%, transparent 65%);
      animation:lgPulse 5s ease-in-out infinite;
    }
    @keyframes lgPulse { 0%,100%{opacity:.5} 50%{opacity:1} }

    #letter-content {
      position:relative; z-index:2;
      width:100%; max-width:700px; margin:0 auto;
      padding:clamp(55px,12vh,110px) clamp(22px,6vw,60px) clamp(70px,12vh,130px);
      display:flex; flex-direction:column; align-items:center;
      text-align:center;
    }

    .letter-block {
      width:100%; opacity:0; transform:translateY(18px);
      transition:opacity 2s ease, transform 2s ease;
      margin-bottom:clamp(22px,4.5vh,44px);
    }
    .letter-block.show { opacity:1; transform:translateY(0); }

    .lb-title {
      font-family:'Dancing Script',cursive;
      font-size:clamp(2.2rem,6vw,3.4rem);
      color:var(--gold);
      text-shadow:0 0 32px var(--gold-glow), 0 0 64px rgba(212,175,55,.18);
      line-height:1.35;
    }

    .lb-para {
      font-family:'Playfair Display',serif;
      font-size:clamp(.95rem,2.4vw,1.22rem);
      font-style:italic; line-height:2.05;
      color:rgba(242,237,230,.82);
    }

    .lb-love {
      font-family:'Playfair Display',serif;
      font-size:clamp(2rem,5vw,3rem);
      font-style:italic; color:var(--red);
      text-shadow:0 0 32px var(--red-glow), 0 0 64px rgba(196,25,59,.2);
    }

    .lb-sig {
      font-family:'Dancing Script',cursive;
      font-size:clamp(2rem,5.5vw,3rem);
      color:var(--gold);
      text-shadow:0 0 24px var(--gold-glow);
      line-height:1.45;
    }

    .lb-sep {
      width:38px; height:1px;
      background:linear-gradient(90deg,transparent,var(--gold),transparent);
      margin:0 auto clamp(20px,4.5vh,44px); opacity:0;
      transition:opacity 2s ease;
    }
    .lb-sep.show { opacity:.38; }

    /* Photo block */
    #letter-photo-wrap {
      opacity:0; transform:scale(.92);
      transition:opacity 2.2s ease, transform 2.2s ease;
      display:flex; flex-direction:column; align-items:center; gap:22px;
      margin-bottom:clamp(22px,4vh,40px);
    }
    #letter-photo-wrap.show { opacity:1; transform:scale(1); }

    .lp-frame {
      position:relative; width:190px; height:190px;
    }
    .lp-ring {
      position:absolute; inset:-10px; border-radius:50%;
      border:2px solid var(--gold);
      box-shadow:0 0 44px var(--gold-glow), 0 0 88px rgba(212,175,55,.18);
      animation:lrGlow 3.5s ease-in-out infinite;
    }
    .lp-ring::before {
      content:''; position:absolute; top:-4px; left:50%; transform:translateX(-50%);
      width:10px; height:10px; border-radius:50%;
      background:var(--gold); box-shadow:0 0 10px var(--gold);
      animation:lrGlow 3.5s ease-in-out infinite;
    }
    @keyframes lrGlow {
      0%,100%{ box-shadow:0 0 44px var(--gold-glow), 0 0 88px rgba(212,175,55,.18); }
      50%{ box-shadow:0 0 70px rgba(212,175,55,.65), 0 0 130px rgba(212,175,55,.28); }
    }
    .lp-inner {
      width:190px; height:190px; border-radius:50%; overflow:hidden;
      position:relative; z-index:1;
      background:linear-gradient(135deg,#1a1014,#2a1520);
      display:flex; align-items:center; justify-content:center;
      font-size:76px;
      box-shadow:0 0 40px rgba(0,0,0,.9);
    }

    /* "Pour toujours" finale */
    #letter-finale {
      opacity:0; transform:translateY(14px) scale(.97);
      transition:opacity 2.8s ease, transform 2.8s ease;
      margin-bottom:clamp(30px,6vh,60px);
    }
    #letter-finale.show { opacity:1; transform:translateY(0) scale(1); }
    .lf-text {
      font-family:'Dancing Script',cursive;
      font-size:clamp(1.9rem,5.5vw,3rem);
      color:var(--white);
      text-shadow:0 0 24px rgba(255,255,255,.28), 0 0 48px var(--red-glow);
    }

    /* Letter replay button */
    #letter-replay-wrap {
      opacity:0; transition:opacity 2s ease;
      margin-bottom:20px;
    }
    #letter-replay-wrap.show { opacity:1; }

    /* Letter mute button — fixed bottom-right */
    #letter-mute {
      position:fixed; bottom:22px; right:22px; z-index:300;
      width:40px; height:40px; border-radius:50%;
      border:1px solid rgba(212,175,55,.22);
      background:rgba(0,0,0,.45);

<body>

<script>
/* ═══════════════════════════════════════════════════════════
   DATA
═══════════════════════════════════════════════════════════ */
const QUESTIONS = [
  {
    q: "Quel est le personnage d'animé préféré de Gabriel ?",
    opts: ["Zoro","Sanji","Naruto","Levi"],
    ans: "Sanji"
  },
  {
    q: "Quand nous sommes-nous mis en couple ?",
    opts: ["13 septembre 2025","14 février 2025","7 août 2025","25 décembre 2025"],
    ans: "13 septembre 2025"
  },
  {
    q: "Quel est l'animé préféré de Gabriel ?",
    opts: ["Dragon Ball","Naruto","One Piece","SNK"],
    ans: "One Piece"
  },
  {
    q: "Quelle est la chose que Gabriel préfère le plus au monde ?",
    opts: ["L'argent","Les voyages","Amandine","Le football"],
    ans: "Amandine"
  },
  {
    q: "Pour Gabriel, qui est la plus belle femme ?",
    opts: ["Sarah Cameron","Amandine","Mélissa","Grand-mère"],
    ans: "Amandine"
  },
  {
    q: "Quel est l'artiste préféré de Gabriel ?",
    opts: ["Michael Jackson","Johnny Hallyday","Charles Aznavour","Elvis Presley"],
    ans: "Charles Aznavour"
  },
  {
    q: "De quelle ville vient Gabriel en Albanie ?",
    opts: ["Tirana","Durrës","Shkodër","Vlorë"],
    ans: "Shkodër"
  },
  {
    q: "Dans quelle couleur Gabriel a-t-il gagné le plus d'argent au casino de Deauville ?",
    opts: ["Rouge","Vert","Noir","Bleu"],
    ans: "Noir"
  },
  {
    q: "Quelle est la série préférée de Gabriel ?",
    opts: ["Prison Break","Breaking Bad","Friends","Outer Banks"],
    ans: "Friends"
  }
];

const QUOTES = [
  { t: "Il n'existe qu'un bonheur dans la vie, c'est d'aimer et d'être aimé.", a: "George Sand" },
  { t: "L'amour est la poésie des sens.", a: "Honoré de Balzac" },
  { t: "Je t'aime non seulement pour ce que tu es, mais pour ce que je suis quand je suis avec toi.", a: "Roy Croft" },
  { t: "Aimer, c'est trouver sa richesse hors de soi.", a: "Alain" },
  { t: "Là où il y a amour, il y a vie.", a: "Mahatma Gandhi" },
  { t: "L'amour ne se regarde pas, il regarde ensemble dans la même direction.", a: "Antoine de Saint-Exupéry" },
  { t: "Le bonheur, c'est de continuer à désirer ce qu'on possède.", a: "Saint Augustin" },
  { t: "Aimer quelqu'un, c'est lui dire : tu ne mourras pas.", a: "Gabriel Marcel" }
];

const OK_MSGS = [
  "Bravo, tu me connais si bien ! ❤️",
  "Exactement ! Mon cœur est à toi 💕",
  "Parfaite ! Tu mérites toutes les étoiles ✨",
  "C'est exactement ça, mon amour ! 💝",
  "Tu m'époustoufiles à chaque fois 💫",
  "Magnifique ! Je t'adore 🌹"
];

const BAD_MSGS = [
  "Presque… on se découvre encore 😊",
  "Pas tout à fait, mais tu restes la plus belle 💕",
  "Petite erreur, tout est pardonné ❤️",
  "On apprendra ensemble, mon amour 🥰"
];

/* ═══════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════ */
let cQ = 0, score = 0, answered = false;
let musicOn = false, audioCtx = null, ambNodes = [];

/* ═══════════════════════════════════════════════════════════
   CANVAS — FLOATING HEARTS
═══════════════════════════════════════════════════════════ */
const cvs = document.getElementById('bg');
const bctx = cvs.getContext('2d');
let parts = [];

function resizeCvs() { cvs.width = innerWidth; cvs.height = innerHeight; }
resizeCvs();
addEventListener('resize', resizeCvs);

function mkPart() {
  return {
    x: Math.random() * cvs.width,
    y: cvs.height + 20,
    sz: Math.random() * 16 + 7,
    spd: Math.random() * .7 + .25,
    op: Math.random() * .22 + .04,
    dr: (Math.random() - .5) * .45,
    col: Math.random() < .65 ? '#c4193b' : '#d4af37'
  };
}

for (let i = 0; i < 32; i++) {
  const p = mkPart();
  p.y = Math.random() * cvs.height;
  parts.push(p);
}

function drawCvs() {
  bctx.clearRect(0, 0, cvs.width, cvs.height);
  parts.forEach((p, i) => {
    p.y -= p.spd; p.x += p.dr;
    bctx.save();
    bctx.globalAlpha = p.op;
    bctx.fillStyle = p.col;
    bctx.font = `${p.sz}px serif`;
    bctx.textAlign = 'center'; bctx.textBaseline = 'middle';
    bctx.fillText('♥', p.x, p.y);
    bctx.restore();
    if (p.y < -20 || p.x < -20 || p.x > cvs.width + 20) parts[i] = mkPart();
  });
  requestAnimationFrame(drawCvs);
}
drawCvs();

/* ═══════════════════════════════════════════════════════════
   AUDIO
═══════════════════════════════════════════════════════════ */
function initAudio() {
  if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function toggleMusic() {
  initAudio();
  musicOn = !musicOn;
  const btn = document.getElementById('music-btn');
  if (musicOn) {
    startAmbient();
    btn.textContent = '♫';
    btn.style.color = 'var(--gold)';
    btn.style.boxShadow = '0 0 14px var(--gold-glow)';
  } else {
    stopAmbient();
    btn.textContent = '♪';
    btn.style.boxShadow = '';
  }
}

function startAmbient() {
  stopAmbient();
  // Soft Cmaj7 pad
  const master = audioCtx.createGain();
  master.gain.setValueAtTime(0, audioCtx.currentTime);
  master.gain.linearRampToValueAtTime(.045, audioCtx.currentTime + 4);
  master.connect(audioCtx.destination);

  [130.81, 164.81, 196.00, 246.94, 261.63].forEach(freq => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const lfo = audioCtx.createOscillator();
    const lg = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq + (Math.random() - .5) * 1.5;
    lfo.frequency.value = .2 + Math.random() * .15;
    lg.gain.value = 1.2;
    lfo.connect(lg); lg.connect(osc.frequency);
    g.gain.value = .42 / 5;
    osc.connect(g); g.connect(master);
    osc.start(); lfo.start();
    ambNodes.push(osc, g, lfo, lg);
  });
  ambNodes.push(master);
}

function stopAmbient() {
  ambNodes.forEach(n => { try { n.stop && n.stop(); } catch(e){} try { n.disconnect(); } catch(e){} });
  ambNodes = [];
}

function playOK() {
  initAudio();
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'sine'; o.frequency.value = f;
    const t = audioCtx.currentTime + i * .11;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.22, t + .05);
    g.gain.exponentialRampToValueAtTime(.001, t + .55);
    o.start(t); o.stop(t + .55);
  });
}

function playBad() {
  initAudio();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sine';
  o.frequency.setValueAtTime(280, audioCtx.currentTime);
  o.frequency.linearRampToValueAtTime(190, audioCtx.currentTime + .45);
  g.gain.setValueAtTime(.18, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .5);
  o.start(); o.stop(audioCtx.currentTime + .5);
}

function playFanfare() {
  initAudio();
  [[523.25,0],[523.25,.14],[523.25,.28],[659.25,.46],[523.25,.68],[659.25,.86],[783.99,1.04]].forEach(([f,d]) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'triangle'; o.frequency.value = f;
    const t = audioCtx.currentTime + d;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.28, t + .05);
    g.gain.exponentialRampToValueAtTime(.001, t + .38);
    o.start(t); o.stop(t + .38);
  });
}

/* ═══════════════════════════════════════════════════════════
   SCREENS
═══════════════════════════════════════════════════════════ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  setTimeout(() => document.getElementById(id).classList.add('active'), 55);
}

function hideScreen(id, cb) {
  document.getElementById(id).classList.remove('active');
  setTimeout(cb, 880);
}

/* ═══════════════════════════════════════════════════════════
   GAME
═══════════════════════════════════════════════════════════ */
function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function startGame() {
  cQ = 0; score = 0; answered = false;
  hideScreen('landing', loadQuestion);
}

function loadQuestion() {
  if (cQ >= QUESTIONS.length) { showResult(); return; }
  const data = QUESTIONS[cQ];
  const shuffled = shuffle(data.opts);
  answered = false;

  document.getElementById('q-counter').textContent = `Question ${cQ + 1} / ${QUESTIONS.length}`;
  document.getElementById('prog-fill').style.width = `${(cQ / QUESTIONS.length) * 100}%`;
  document.getElementById('score-chip').textContent = `${score} ❤️`;
  document.getElementById('q-label').textContent = `Question ${String(cQ + 1).padStart(2,'0')}`;
  document.getElementById('q-text-main').textContent = data.q;

  const fb = document.getElementById('feedback');
  fb.textContent = ''; fb.className = 'feedback';

  // Restart card animation
  const card = document.getElementById('q-card');
  card.style.animation = 'none';
  void card.offsetWidth;
  card.style.animation = '';

  const grid = document.getElementById('ans-grid');
  grid.style.animation = 'none';
  void grid.offsetWidth;
  grid.style.animation = '';

  grid.innerHTML = '';
  const letters = ['A','B','C','D'];
  shuffled.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.innerHTML = `<span class="ans-letter">${letters[i]}</span><span>${opt}</span>`;
    btn.onclick = () => handleAnswer(btn, opt, data.ans);
    grid.appendChild(btn);
  });

  showScreen('question-screen');
}

function handleAnswer(btn, chosen, correct) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback');

  if (chosen === correct) {
    btn.classList.add('correct');
    score++;
    document.getElementById('score-chip').textContent = `${score} ❤️`;
    fb.textContent = OK_MSGS[Math.floor(Math.random() * OK_MSGS.length)];
    fb.className = 'feedback ok show';
    playOK();
    burstHearts(btn);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.ans-btn').forEach(b => {
      if (b.querySelector('span:last-child').textContent === correct) b.classList.add('correct');
    });
    fb.textContent = BAD_MSGS[Math.floor(Math.random() * BAD_MSGS.length)];
    fb.className = 'feedback bad show';
    playBad();
  }

  setTimeout(() => {
    cQ++;
    if (cQ < QUESTIONS.length) {
      hideScreen('question-screen', showQuote);
    } else {
      hideScreen('question-screen', showResult);
    }
  }, 1900);
}

function showQuote() {
  const q = QUOTES[(cQ - 1) % QUOTES.length];
  document.getElementById('quote-text').textContent = `« ${q.t} »`;
  document.getElementById('quote-author').textContent = `— ${q.a}`;

  const wrap = document.getElementById('quote-wrap');
  wrap.className = 'quote-wrap';

  showScreen('quote-screen');

  setTimeout(() => { wrap.classList.add('in'); }, 120);

  setTimeout(() => {
    wrap.classList.remove('in');
    wrap.classList.add('out');
    setTimeout(() => hideScreen('quote-screen', loadQuestion), 750);
  }, 2600);
}

/* ═══════════════════════════════════════════════════════════
   HEART BURST (correct answer)
═══════════════════════════════════════════════════════════ */
function burstHearts(btn) {
  const r = btn.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const emojis = ['❤️','💕','✨','💖','🌹'];

  for (let i = 0; i < 14; i++) {
    const el = document.createElement('div');
    el.className = 'hb';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const angle = (i / 14) * Math.PI * 2;
    const dist = 55 + Math.random() * 65;
    const tx = Math.cos(angle) * dist;
    const ty = Math.sin(angle) * dist - 30;
    const dur = .75 + Math.random() * .35;
    const delay = Math.random() * .18;
    el.style.cssText = `left:${cx}px;top:${cy}px;font-size:${13 + Math.random() * 13}px;transform:translate(-50%,-50%);opacity:1;transition-duration:${dur}s;transition-delay:${delay}s;`;
    document.body.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      el.style.transform = `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`;
      el.style.opacity = '0';
    }));
    setTimeout(() => el.remove(), (dur + delay) * 1000 + 150);
  }
}

/* ═══════════════════════════════════════════════════════════
   RESULT
═══════════════════════════════════════════════════════════ */
function showResult() {
  const pct = score / QUESTIONS.length;

  document.getElementById('prog-fill').style.width = '100%';
  document.getElementById('res-score').textContent = `${score} / ${QUESTIONS.length}`;

  // Stars
  const starsEl = document.getElementById('res-stars');
  starsEl.innerHTML = '';
  const nStars = pct === 1 ? 5 : pct >= .78 ? 4 : pct >= .56 ? 3 : pct >= .34 ? 2 : 1;
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('span');
    s.className = 'res-star';
    s.textContent = i < nStars ? '⭐' : '☆';
    s.style.animationDelay = `${.3 + i * .1}s`;
    starsEl.appendChild(s);
  }

  const icon  = document.getElementById('res-icon');
  const title = document.getElementById('res-title');
  const msg   = document.getElementById('res-msg');

  if (pct === 1) {
    icon.textContent = '💝';
    title.innerHTML  = '<span class="shimmer">Parfait, absolument parfait !</span>';
    msg.innerHTML    = `Tu connais parfaitement Gabriel…<br>et c'est pour ça qu'il t'aime autant <span class="r">❤️</span><br><br><em>Tu es la plus belle chose qui lui soit arrivée,<br><span class="g">son amour, sa vie, son tout.</span></em>`;
    setTimeout(playFanfare, 600);
    startHeartRain(22);
    launchConfetti();
  } else if (pct >= .78) {
    icon.textContent = '💖';
    title.textContent = 'Impressionnante !';
    msg.innerHTML    = `Tu le connais vraiment bien, mon amour…<br>Quelques petits secrets restent à découvrir 🥰<br><em>Mais une chose est sûre : <span class="g">il t'aime plus que tout.</span></em>`;
    startHeartRain(10);
  } else if (pct >= .56) {
    icon.textContent = '💗';
    title.textContent = 'Pas mal du tout !';
    msg.innerHTML    = `Tu le connais bien, mais il reste encore des surprises…<br>C'est ça la beauté de l'amour : <span class="g">toujours se redécouvrir ✨</span>`;
    startHeartRain(5);
  } else {
    icon.textContent = '💓';
    title.textContent = 'On va apprendre ensemble !';
    msg.innerHTML    = `L'amour ne se mesure pas en bonnes réponses…<br>Il se mesure dans les sourires, les câlins, les regards.<br><span class="g">Et là, tu es championne ❤️</span>`;
    startHeartRain(3);
  }

  showScreen('result-screen');
}

function startHeartRain(count) {
  let n = 0;
  const iv = setInterval(() => {
    if (n >= count * 3) { clearInterval(iv); return; }
    spawnHF(); n++;
  }, count >= 20 ? 140 : 280);
}

function spawnHF() {
  const emojis = ['❤️','💕','💖','💗','💝','✨','🌹','💫'];
  const el = document.createElement('div');
  el.className = 'hf';
  el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
  el.style.cssText = `
    left:${Math.random() * 100}vw;top:105vh;
    font-size:${16 + Math.random() * 26}px;
    animation:hfloat ${3 + Math.random() * 3}s linear ${Math.random() * .8}s forwards;
  `;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 7500);
}

function launchConfetti() {
  const colors = ['#c4193b','#d4af37','#f5d76e','#ffffff','#ff7070','#ffd700','#ff6b9d'];
  for (let i = 0; i < 160; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'conf';
      const sz = 4 + Math.random() * 9;
      c.style.cssText = `
        left:${Math.random() * 100}vw; top:-12px;
        width:${sz}px; height:${sz}px;
        background:${colors[Math.floor(Math.random() * colors.length)]};
        border-radius:${Math.random() > .5 ? '50%' : '2px'};
        animation:confFall ${2.2 + Math.random() * 3}s linear forwards;
      `;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5500);
    }, Math.random() * 3200);
  }
}

function restartGame() {
  stopLetterMusic();
  clearInterval(letterHeartsIv);
  document.getElementById('letter-mute').classList.remove('visible');
  const src = document.querySelector('.screen.active');
  const sid = src ? src.id : 'result-screen';
  hideScreen(sid, () => {
    document.querySelectorAll('.hf,.hb,.conf').forEach(e => e.remove());
    cQ = 0; score = 0;
    document.getElementById('prog-fill').style.width = '0%';
    // reset letter screen
    document.getElementById('letter-lines').innerHTML = '';
    document.getElementById('letter-photo-wrap').classList.remove('show');
    document.getElementById('letter-finale').classList.remove('show');
    document.getElementById('letter-replay-wrap').classList.remove('show');
    showScreen('landing');
  });
}

/* ═══════════════════════════════════════════════════════════
   LETTER SCREEN
═══════════════════════════════════════════════════════════ */
let letterNodes = [], letterMasterGain = null, letterMuted = false, letterHeartsIv = null;

const LETTER_BLOCKS = [
  { type:'title', text:'Joyeux huit mois,\nmon amour.' },
  { type:'para',  text:"J'espère que tu es contente de tes chaussures\net qu'elles sont parfaitement moelleuses\npour tes petits petons." },
  { type:'para',  text:"Je voulais juste te dire à quel point je t'aime.\nJ'espère que tu as quand même bien aimé le questionnaire.\nJ'ai essayé de le coder, bon… des fois ça buggait un peu,\ndonc j'ai fait en sorte que ça ne bug plus.\nJ'espère que maintenant tout marche bien." },
  { type:'para',  text:"Je t'aime.\nTu es la meilleure chose qui me soit arrivée.\nJe suis tellement pressé de partir en Albanie avec toi\net de vivre encore plein de choses à tes côtés\ntellement je t'aime." },
  { type:'para',  text:"Tu es la femme de ma vie.\nJe veux que tu arrêtes d'en douter\net que tu me fasses confiance,\nparce que le plus important pour moi, c'est nous,\net je veux que ça continue comme ça\njusqu'à la fin de nos jours." },
  { type:'love',  text:"Je t'aime." },
  { type:'sig',   text:'Ton amoureux,\nGabriel ❤️' },
];

// Cumulative show time in ms for each block
const BDEL = [1600, 5800, 10800, 17200, 24000, 31000, 35500];
const PHOTO_DEL  = 40000;
const FINALE_DEL = 45500;
const REPLAY_DEL = 50000;

function showLetter() {
  stopAmbient();
  document.querySelectorAll('.hf,.conf').forEach(e => e.remove());

  showScreen('letter-screen');
  startLetterMusic();

  const muteBtn = document.getElementById('letter-mute');
  muteBtn.classList.add('visible');
  muteBtn.textContent = '🔊';
  muteBtn.style.color = '';
  letterMuted = false;

  // Build blocks
  const container = document.getElementById('letter-lines');
  container.innerHTML = '';

  LETTER_BLOCKS.forEach((block, i) => {
    const el = document.createElement('div');
    el.className = 'letter-block';
    const inner = block.text.replace(/\n/g, '<br>');
    if (block.type === 'title') el.innerHTML = `<div class="lb-title">${inner}</div>`;
    else if (block.type === 'para') el.innerHTML = `<div class="lb-para">${inner}</div>`;
    else if (block.type === 'love') el.innerHTML = `<div class="lb-love">${inner}</div>`;
    else el.innerHTML = `<div class="lb-sig">${inner}</div>`;
    container.appendChild(el);

    // Separator between paragraphs (not after last two)
    if (i < LETTER_BLOCKS.length - 2) {
      const sep = document.createElement('div');
      sep.className = 'lb-sep';
      container.appendChild(sep);
      setTimeout(() => sep.classList.add('show'), BDEL[i] + 600);
    }

    setTimeout(() => {
      el.classList.add('show');
      setTimeout(() => el.scrollIntoView({ behavior:'smooth', block:'nearest' }), 300);
    }, BDEL[i]);
  });

  const photoWrap = document.getElementById('letter-photo-wrap');
  const finale    = document.getElementById('letter-finale');
  const replay    = document.getElementById('letter-replay-wrap');
  photoWrap.classList.remove('show');
  finale.classList.remove('show');
  replay.classList.remove('show');

  setTimeout(() => {
    photoWrap.classList.add('show');
    setTimeout(() => photoWrap.scrollIntoView({ behavior:'smooth', block:'nearest' }), 300);
    // extra heart burst around photo reveal
    for (let i = 0; i < 20; i++) setTimeout(spawnHF, Math.random() * 2500);
  }, PHOTO_DEL);

  setTimeout(() => {
    finale.classList.add('show');
    setTimeout(() => finale.scrollIntoView({ behavior:'smooth', block:'nearest' }), 300);
    for (let i = 0; i < 35; i++) setTimeout(spawnHF, Math.random() * 4000);
  }, FINALE_DEL);

  setTimeout(() => {
    replay.classList.add('show');
  }, REPLAY_DEL);

  // Continuous slow heart drift throughout
  let hCount = 0;
  clearInterval(letterHeartsIv);
  letterHeartsIv = setInterval(() => {
    if (hCount > 300) { clearInterval(letterHeartsIv); return; }
    spawnHF(); hCount++;
  }, 700);
}

/* ─── Letter piano music ─────────────────────────────── */
function startLetterMusic() {
  initAudio();
  stopLetterMusic();

  letterMasterGain = audioCtx.createGain();
  letterMasterGain.gain.setValueAtTime(0, audioCtx.currentTime);
  letterMasterGain.gain.linearRampToValueAtTime(.06, audioCtx.currentTime + 10); // slow gentle rise
  letterMasterGain.connect(audioCtx.destination);

  schedulePiano();
}

function stopLetterMusic() {
  if (letterMasterGain) {
    try {
      letterMasterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 2);
    } catch(e) {}
    setTimeout(() => {
      letterNodes.forEach(n => { try{n.stop&&n.stop();}catch(e){} try{n.disconnect();}catch(e){} });
      letterNodes = [];
      try { letterMasterGain && letterMasterGain.disconnect(); } catch(e) {}
      letterMasterGain = null;
    }, 2500);
  }
}

function toggleLetterMusic() {
  initAudio();
  const btn = document.getElementById('letter-mute');
  letterMuted = !letterMuted;
  if (letterMuted) {
    if (letterMasterGain) letterMasterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + .6);
    btn.textContent = '🔇';
    btn.style.color = 'rgba(255,255,255,.35)';
  } else {
    if (letterMasterGain) letterMasterGain.gain.linearRampToValueAtTime(.06, audioCtx.currentTime + 1.2);
    btn.textContent = '🔊';
    btn.style.color = '';
  }
}

function lPianoNote(freq, t, dur, amp) {
  if (!letterMasterGain) return;
  // triangle fundamental + sine harmonics → soft piano timbre
  [[freq,.5,'triangle'],[freq*2,.28,'sine'],[freq*4,.07,'sine']].forEach(([f,rel,type]) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = f;
    o.connect(g); g.connect(letterMasterGain);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(amp * rel, t + .013);
    g.gain.exponentialRampToValueAtTime(amp * rel * .38, t + .09);
    g.gain.exponentialRampToValueAtTime(amp * rel * .18, t + dur * .55);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.start(t); o.stop(t + dur + .06);
    letterNodes.push(o, g);
  });
}

function lPad(freq, t, dur, amp) {
  if (!letterMasterGain) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  o.connect(g); g.connect(letterMasterGain);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(amp, t + 2);
  g.gain.linearRampToValueAtTime(amp, t + dur - 2);
  g.gain.linearRampToValueAtTime(0, t + dur);
  o.start(t); o.stop(t + dur + .1);
  letterNodes.push(o, g);
}

function schedulePiano() {
  const now = audioCtx.currentTime;
  const Q = 1.0; // quarter note @ 60 BPM
  const H = 2.0, W = 4.0;

  // "You Are Not Alone" inspired melody — Bb major, 60 BPM
  // Bb3=233.08 C4=261.63 D4=293.66 Eb4=311.13 F4=349.23 G4=392 Ab4=415.3 Bb4=466.16 C5=523.25 D5=587.33 F5=698.46
  const F4=349.23, Eb4=311.13, D4=293.66, Bb3=233.08, G4=392.00, Ab4=415.30,
        Bb4=466.16, C5=523.25, D5=587.33, C4=261.63, F5=698.46, Eb5=622.25;

  const mel = [
    // Verse 1 feel
    [F4,   0*Q, H,   .13],
    [Eb4,  2*Q, Q,   .11],
    [D4,   3*Q, Q,   .11],
    [Bb3,  4*Q, H+Q, .14],
    // Phrase 2
    [F4,   7*Q, Q,   .12],
    [G4,   8*Q, Q,   .12],
    [F4,   9*Q, Q,   .11],
    [Eb4, 10*Q, Q,   .11],
    [D4,  11*Q, H,   .13],
    [C4,  13*Q, Q,   .10],
    [Bb3, 14*Q, H,   .12],
    // Phrase 3 rise
    [D4,  16*Q, Q,   .11],
    [Eb4, 17*Q, Q,   .11],
    [F4,  18*Q, Q,   .12],
    [G4,  19*Q, Q,   .13],
    [Bb4, 20*Q, H,   .15],
    [Ab4, 22*Q, Q,   .12],
    [G4,  23*Q, Q,   .11],
    // Phrase 4 resolution
    [F4,  24*Q, Q,   .11],
    [Eb4, 25*Q, Q,   .11],
    [D4,  26*Q, Q,   .10],
    [C4,  27*Q, Q,   .10],
    [Bb3, 28*Q, W,   .14],
    // Chorus feel — "You are not alone"
    [Bb4, 32*Q, H,   .16],
    [G4,  34*Q, Q,   .13],
    [F4,  35*Q, Q,   .12],
    [Eb4, 36*Q, Q,   .11],
    [D4,  37*Q, Q,   .11],
    [C4,  38*Q, H,   .12],
    [Bb3, 40*Q, H,   .13],
    // High phrase
    [Bb4, 42*Q, Q,   .15],
    [C5,  43*Q, Q,   .15],
    [D5,  44*Q, H,   .16],
    [C5,  46*Q, Q,   .13],
    [Bb4, 47*Q, Q,   .12],
    [G4,  48*Q, Q,   .11],
    [F4,  49*Q, Q,   .11],
    [Eb4, 50*Q, H,   .12],
    [D4,  52*Q, W,   .13],
    // Final ascent
    [F4,  56*Q, Q,   .11],
    [G4,  57*Q, Q,   .12],
    [Bb4, 58*Q, H,   .15],
    [Ab4, 60*Q, Q,   .12],
    [G4,  61*Q, Q,   .11],
    [F4,  62*Q, Q,   .10],
    [Eb4, 63*Q, Q,   .10],
    [D4,  64*Q, H,   .12],
    [Bb3, 66*Q, W*2, .13], // final long resolution
  ];

  mel.forEach(([f,t,d,a]) => lPianoNote(f, now+t, d, a));

  // Chord pads underneath — Bb · F · Gm · Eb progression
  const Bb2=116.54, F3=174.61, F2=87.31, Eb2=77.78, G2=98.00;
  const prog = [
    // [time, chordFreqs, duration, amp]
    [0,    [Bb2,F3,Bb3,D4],   W, .018],
    [W,    [Bb2,F3,Bb3,D4],   W, .018],
    [W*2,  [F2, F3,C4, F4],   W, .018],
    [W*3,  [F2, F3,C4, F4],   W, .018],
    [W*4,  [G2, D4,G4, Bb4],  W, .018],
    [W*5,  [G2, D4,G4, Bb4],  W, .018],
    [W*6,  [Eb2,G2,Eb4,G4],   W, .018],
    [W*7,  [Eb2,G2,Eb4,G4],   W, .018],
    [W*8,  [Bb2,F3,Bb3,D4],   W, .018],
    [W*9,  [Bb2,F3,Bb3,D4],   W, .018],
    [W*10, [F2, F3,C4, F4],   W, .018],
    [W*11, [F2, F3,C4, F4],   W, .018],
    [W*12, [G2, D4,G4, Bb4],  W, .018],
    [W*13, [G2, D4,G4, Bb4],  W, .018],
    [W*14, [Eb2,G2,Eb4,G4],   W*2,.018],
    [W*16, [Bb2,F3,Bb3,D4],   W*4,.015],
  ];

  prog.forEach(([t,freqs,d,a]) => freqs.forEach(f => lPad(f, now+t, d, a)));
}
